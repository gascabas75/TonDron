name: Flathub Build - TonDron-VideoEdit
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
jobs:
  flatpak:
    runs-on: ubuntu-latest
    container: { image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-46, options: --privileged }
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: TonDron-VideoEdit.flatpak
          manifest-path: flatpak/com.tondron.TonDron.yml